[project]
name = "devrelay-local-proxy"
version = "0.1.0"
description = "Rule based local HTTPS proxy for DevRelay browser debugging"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "mitmproxy>=9,<12",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.27,<1",
]

[tool.uv]
package = false
